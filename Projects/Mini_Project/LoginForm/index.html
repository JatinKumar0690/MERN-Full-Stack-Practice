<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" width="device-width" initial-scale="1.0" />
    <title>Instagram Login</title>
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 90vh;
        background-color: skyblue;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif,
          "Apple Color Emoji",
          "Segoe UI Emoji";
      }
      .login-class {
        height: 500px;
        width: 500px;
        padding-top: 50px;
        background-color: white;
        border-radius: 30px;
      }
      #username {
        height: 50px;
        width: 80%;
        margin-left: 40px;
        padding-left: 10px;
        border: 2px dotted black;
        border-radius: 20px;
      }
      #password {
        height: 50px;
        width: 80%;
        margin-left: 40px;
        padding-left: 10px;
        border: 2px dotted black;
        border-radius: 20px;
      }
      #user-label {
        margin-left: 40px;
        font-size: 1.2rem;
      }
      #user-password {
        margin-left: 40px;
        font-size: 1.2rem;
      }
      #login-btn {
        width: 84%;
        height: 50px;
        margin-left: 40px;
        background-color: #0066ff;
        border: none;
        cursor: pointer;
        font-size: 1.1rem;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="login-class">
      <form id="login-form" action="https://google.com">
        <label for="username" id="user-label">Username:</label>
        <br /><br />
        <input
          type="text"
          id="username"
          placeholder="Username"
          name="username"
          required
        />

        <br />
        <br />

        <label for="password" id="user-password">Password:</label>
        <br /><br />
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          name="password"
          required
        />

        <br />
        <br /><br />
        <button type="submit" id="login-btn">Login</button>
      </form>
    </div>
  </body>
</html>
